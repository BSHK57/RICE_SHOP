<!doctype html>
<html lang="en">
<head>
  {% include '_head.html' %}
  <title>Sign in · Rice Shop Manager</title>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-b from-accent-50 via-stone-50 to-stone-100 px-4 py-10 text-stone-800 antialiased">
  <main class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-primary-600 text-white shadow-lg shadow-primary-600/20">
        <svg viewBox="0 0 24 24" class="h-9 w-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V9"/><path d="M12 9c-2.5 0-4-1.7-4-4 2.5 0 4 1.7 4 4z"/><path d="M12 9c2.5 0 4-1.7 4-4-2.5 0-4 1.7-4 4z"/><path d="M12 15c-2.5 0-4-1.7-4-4 2.5 0 4 1.7 4 4z"/><path d="M12 15c2.5 0 4-1.7 4-4-2.5 0-4 1.7-4 4z"/><path d="M12 9V3"/></svg>
      </span>
      <h1 class="mt-4 text-2xl font-semibold text-stone-900">Rice Shop Manager</h1>
      <p class="mt-1 text-sm text-stone-500">Sign in to continue</p>
    </div>

    <form id="login-form" class="space-y-4 rounded-2xl border border-stone-200 bg-white p-6 shadow-sm" novalidate>
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-stone-700">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus
               class="block w-full rounded-lg border border-stone-300 bg-white px-3 py-2.5 text-base text-stone-900 shadow-sm placeholder:text-stone-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200 sm:text-sm">
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-stone-700">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 class="block w-full rounded-lg border border-stone-300 bg-white py-2.5 pl-3 pr-11 text-base text-stone-900 shadow-sm placeholder:text-stone-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200 sm:text-sm">
          <button type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false"
                  class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-lg text-stone-400 hover:text-stone-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
            <svg id="pw-eye" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="pw-eye-off" viewBox="0 0 24 24" class="hidden h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.5 7.5C3.8 9.3 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <p id="login-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>
      <button type="submit" id="login-btn"
              class="flex min-h-[2.75rem] w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2 disabled:opacity-60">
        <span id="login-spin" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent" aria-hidden="true"></span>
        <span id="login-label">Sign in</span>
      </button>
    </form>
    <p class="mt-4 text-center text-xs text-stone-400">Private shop system &middot; authorised users only</p>
  </main>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
