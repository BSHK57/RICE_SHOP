{#- Customers tab partial. static/js/tabs/customers.js builds the list. -#}
<section id="tab-customers" data-tab-panel="customers" class="hidden">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-semibold text-stone-900">Customers</h2>
      <p class="text-sm text-stone-500">Everyone you sell to, with purchase history and credit.</p>
    </div>
    <button type="button" data-role="add" class="hidden min-h-[2.75rem] items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-primary-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-2">
      <span data-icon="plus" data-icon-class="h-4 w-4"></span>Add customer
    </button>
  </div>
  <div class="mb-4 flex flex-wrap items-center gap-3">
    <div class="relative min-w-[14rem] flex-1">
      <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-stone-400"><span data-icon="search" data-icon-class="h-4 w-4"></span></span>
      <input data-role="search" type="search" autocomplete="off" placeholder="Search by name, phone or place" aria-label="Search customers"
             class="block w-full rounded-lg border border-stone-300 bg-white py-2.5 pl-9 pr-3 text-base text-stone-900 shadow-sm placeholder:text-stone-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-200 sm:text-sm">
    </div>
    <label data-role="inactive-wrap" class="hidden items-center gap-2 text-sm text-stone-600">
      <input data-role="inactive" type="checkbox" class="h-4 w-4 rounded border-stone-300 text-primary-600 focus:ring-primary-500"> Show inactive
    </label>
    <p data-role="count" class="text-sm text-stone-500"></p>
  </div>
  <div data-role="list" aria-live="polite"></div>
</section>
