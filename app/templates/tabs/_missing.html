{#- Fallback panel used by index.html when a tab partial does not exist (yet). Needs the loop variable `t`. -#}
<section id="tab-{{ t.id }}" data-tab-panel="{{ t.id }}" class="hidden">
  <div class="rounded-xl border border-dashed border-stone-300 bg-white p-8 text-center text-sm text-stone-500">
    The “{{ t.label }}” section is not available yet.
  </div>
</section>
